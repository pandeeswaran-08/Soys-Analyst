[project]
name = "soydecision-agent"
version = "0.1.0"
description = "LangGraph decision agent for SoyDecision Desk agricultural commodity desk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.1",
    "langchain-openai>=0.3.1",
    "langchain-community>=0.3.14",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "qdrant-client>=1.12.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

