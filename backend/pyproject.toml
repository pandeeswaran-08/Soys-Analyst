[project]
name = "soydecision-backend"
version = "0.1.0"
description = "FastAPI backend and pure Python math core for SoyDecision Desk commodity analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "statsmodels>=0.14.0",
    "scipy>=1.14.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.19",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

